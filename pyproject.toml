    "fastapi==0.115.12",
    "httpx==0.28.1",
    "jwt>=1.4.0",
    "pandas>=3.0.6",
    "pwdlib[argon2]==0.2.1",
    "pydantic==2.11.5",
    "pydantic-settings==2.9.1",
